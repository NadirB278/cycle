<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FF6B8B"/>
      <stop offset="1" stop-color="#FF375F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#B0002A" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <g filter="url(#soft)" fill="none" stroke-linecap="round">
    <!-- anneau du cycle : piste translucide et portion « règles » -->
    <circle cx="512" cy="512" r="272" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="84"/>
    <path d="M 512 240 A 272 272 0 0 1 767.6 605" stroke="#FFFFFF" stroke-width="84"/>
    <!-- goutte -->
    <path d="M512 352 C 512 352 428 446 428 536 A 84 84 0 0 0 596 536 C 596 446 512 352 512 352 Z" fill="#FFFFFF"/>
  </g>
</svg>
